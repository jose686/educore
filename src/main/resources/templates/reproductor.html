<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{layout :: common-head(${leccion.titulo})}"></div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
</head>
<body>
    <!-- Navbar -->
    <header th:replace="~{layout :: navbar}"></header>

    <!-- Main Workspace Fluid Container -->
    <div class="container-fluid flex-grow-1 d-flex flex-column my-0 py-0">
        <div class="row flex-grow-1">
            
            <!-- Left Sidebar: Course Syllabus (col-md-4 col-lg-3) -->
            <nav class="col-12 col-md-4 col-lg-3 bg-dark bg-opacity-20 border-end border-white border-opacity-10 py-4 overflow-y-auto" style="max-height: calc(100vh - 73px);">
                <div class="px-2 mb-4">
                    <a th:href="@{/mis-cursos}" class="text-secondary text-decoration-none fs-7 mb-2 d-inline-block hover-white">
                        <i class="bi bi-chevron-left me-1"></i> Volver a mi biblioteca
                    </a>
                    <h5 class="fw-bold text-white mb-0" th:text="${curso.titulo}">Título del Curso</h5>
                    
                    <!-- Subscription Status Warning Badge -->
                    <div th:if="${diasRestantes != null}" class="mt-3">
                        <span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-20 py-2 px-3 fs-8 rounded-3 d-block w-100 text-center lh-sm">
                            <i class="bi bi-clock-history me-1"></i> Acceso finaliza en <span class="fw-bold" th:text="${diasRestantes}">0</span> días
                        </span>
                    </div>
                </div>

                <!-- Accordion / Module List -->
                <div class="accordion accordion-flush" id="syllabusAccordion">
                    
                    <!-- Loop Modules -->
                    <div class="accordion-item bg-transparent border-0 mb-2" th:each="moduloItem, moduloStat : ${curso.modulos}">
                        <h2 class="accordion-header">
                            <button class="accordion-button bg-transparent text-white border-0 py-2 px-3 fw-semibold shadow-none" 
                                    type="button" 
                                    data-bs-toggle="collapse" 
                                    th:data-bs-target="'#collapse-' + ${moduloItem.id}" 
                                    aria-expanded="true" 
                                    th:text="${moduloItem.nombre}">
                                Nombre del Módulo
                            </button>
                        </h2>
                        
                        <!-- Collapsible module lessons -->
                        <div th:id="'collapse-' + ${moduloItem.id}" class="accordion-collapse collapse show" data-bs-parent="#syllabusAccordion">
                            <div class="accordion-body p-0 mt-1">
                                <ul class="list-group list-group-flush bg-transparent">
                                    
                                    <!-- Loop Lessons -->
                                    <li class="list-group-item bg-transparent border-0 py-2 px-4" th:each="lec : ${moduloItem.lecciones}">
                                        <!-- Lesson Link (Highlights if active) -->
                                        <a th:href="@{'/aula/' + ${curso.id} + '/leccion/' + ${lec.id}}" 
                                           class="text-decoration-none d-flex align-items-center justify-content-between text-muted-custom fs-7 py-1 px-2 rounded-2"
                                           th:classappend="${lec.id == leccion.id} ? 'bg-indigo bg-opacity-25 text-white fw-bold border-start border-3 border-indigo' : 'hover-bg-white-10'">
                                            <span class="text-truncate">
                                                <i class="bi bi-play-circle me-2 align-middle fs-6" th:classappend="${lec.id == leccion.id} ? 'text-gradient' : ''"></i>
                                                <span th:text="${lec.titulo}">Título de Lección</span>
                                            </span>
                                            <i th:if="${lec.videoUrl != null && !lec.videoUrl.isEmpty()}" class="bi bi-film fs-8 text-secondary"></i>
                                        </a>
                                    </li>
                                    
                                </ul>
                            </div>
                        </div>
                    </div>

                </div>
            </nav>

            <!-- Right Main Area: Video Player & Lesson Content (col-md-8 col-lg-9) -->
            <main class="col-12 col-md-8 col-lg-9 py-4 px-4 px-md-5 overflow-y-auto" style="max-height: calc(100vh - 73px);">
                
                <!-- Video frame if available -->
                <div th:if="${leccion.videoUrl != null && !leccion.videoUrl.isEmpty()}" class="mb-4 shadow-lg rounded-4 overflow-hidden bg-black ratio ratio-16x9" id="video-player-container">
                    <!-- Reproductor de vídeo inyectado por Javascript -->
                </div>

                <!-- Lesson Info Header -->
                <div class="border-bottom border-white border-opacity-10 pb-3 mb-4">
                    <h2 class="fw-bold text-white mb-2" th:text="${leccion.titulo}">Título de la Lección</h2>
                    <span class="badge bg-indigo bg-opacity-25 text-indigo-300 border border-indigo border-opacity-20 px-3 py-1.5 fs-8 rounded-pill">
                        <i class="bi bi-clock me-1"></i> Aula Virtual Abierta
                    </span>
                </div>

                <!-- Lesson Text Content -->
                <div class="text-white-80 lh-lg fs-6 mb-5" th:utext="${leccion.contenido}">
                    Aquí se renderizará el texto principal de la clase.
                </div>

                <!-- Chess Minigame / Interactive Container -->
                <div th:if="${leccion.rutaScriptInteractivo != null && !leccion.rutaScriptInteractivo.isEmpty()}" 
                     class="card glass-card border border-white border-opacity-10 p-4 p-md-5 mb-5 shadow-lg">
                    <div class="d-flex align-items-center mb-4 pb-2 border-bottom border-white border-opacity-10">
                        <i class="bi bi-puzzle text-gradient fs-3 me-2"></i>
                        <div>
                            <h4 class="text-white fw-bold mb-0">Zona Interactiva</h4>
                            <p class="text-muted-custom fs-8 mb-0">Ejecuta jugadas tácticas en base a la clase actual.</p>
                        </div>
                    </div>

                    <!-- Canvas for Chess / Minigame - Rendered as secure iframe -->
                    <div class="w-100 rounded-4 overflow-hidden border border-white border-opacity-10 bg-dark bg-opacity-40">
                        <iframe th:src="${recursoInteractivo != null ? recursoInteractivo.resolvedHtmlUrl : leccion.rutaScriptInteractivo}" 
                                sandbox="allow-scripts allow-same-origin" 
                                style="width: 100%; aspect-ratio: 16/9; border: none; display: block;">
                        </iframe>
                    </div>
                </div>


            </main>

        </div>
    </div>

    <!-- Footer -->
    <footer th:replace="~{layout :: footer}"></footer>

    <!-- Bootstrap JS -->
    <div th:replace="~{layout :: bootstrap-js}"></div>

    <!-- JavaScript inyectado para interactivos dinámicos y reproductor de video -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener("DOMContentLoaded", function() {
            // Thymeleaf inyecta de forma segura el path asignado en la entidad Leccion
            const interactiveScriptPath = [[${leccion.rutaScriptInteractivo}]];
            
            if (interactiveScriptPath) {
                console.log("Inyección dinámica: Cargando interactivos desde: " + interactiveScriptPath);
            }

            // Inicializar reproductor de video
            const videoUrl = [[${leccion.videoUrl}]];
            const esVideoLocal = [[${leccion.esVideoLocal}]];
            const container = document.getElementById('video-player-container');
            if (container && videoUrl) {
                renderVideoPlayer(videoUrl, esVideoLocal, container);
            }
        });

        function renderVideoPlayer(url, isLocal, container) {
            container.innerHTML = ''; // Limpiar contenedor
            
            if (isLocal) {
                if (url.endsWith('.m3u8')) {
                    // Condición B (Vídeo Local con HLS.js y protección anti-descarga)
                    container.innerHTML = `
                        <video id="hls-video-player" class="w-100 h-100" style="object-fit: contain; background-color: #000;" 
                               controls controlsList="nodownload" oncontextmenu="return false;" preload="metadata">
                            Tu navegador no soporta el formato de vídeo.
                        </video>
                    `;
                    
                    const videoElement = document.getElementById('hls-video-player');
                    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(videoElement);
                    } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                        // Soporte HLS nativo (Safari en macOS / iOS)
                        videoElement.src = url;
                    } else {
                        videoElement.innerHTML = `<source src="${url}" type="application/x-mpegURL">Tu navegador no soporta reproducción HLS.`;
                    }
                } else {
                    // Vídeo local MP4 clásico (Soporte retrocompatible y fallback con protección anti-descarga)
                    container.innerHTML = `
                        <video id="classic-video-player" class="w-100 h-100" style="object-fit: contain; background-color: #000;" 
                               controls controlsList="nodownload" oncontextmenu="return false;" preload="metadata">
                            <source src="${url}" type="video/mp4">
                            Tu navegador no soporta el formato de vídeo.
                        </video>
                    `;
                }
                return;
            }


            
            // Condición A (Vídeo Externo)
            // Comprobar si es un enlace de YouTube (watch?v= o youtu.be)
            var ytMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
            if (ytMatch && ytMatch[1]) {
                var embedUrl = 'https://www.youtube-nocookie.com/embed/' + ytMatch[1] + '?modestbranding=1&rel=0&iv_load_policy=3';
                container.innerHTML = `<iframe class="w-100 h-100" src="${embedUrl}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
                return;
            }

            // Comprobar si es un enlace de Vimeo
            var vimeoMatch = url.match(/(?:vimeo\.com\/|player\.vimeo\.com\/video\/)([0-9]+)/i);
            if (vimeoMatch && vimeoMatch[1]) {
                var embedUrl = 'https://player.vimeo.com/video/' + vimeoMatch[1];
                container.innerHTML = `<iframe class="w-100 h-100" src="${embedUrl}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
                return;
            }

            // Fallback para otros vídeos externos
            container.innerHTML = `<iframe class="w-100 h-100" src="${url}" frameborder="0" allowfullscreen></iframe>`;
        }

        /*]]>*/
    </script>
</body>
</html>
