<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: common-head('Compra Exitosa')}"></head>
<body>
    <!-- Navbar -->
    <header th:replace="~{layout :: navbar}"></header>

    <!-- Main Content Container -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center text-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card glass-card p-5 border border-white border-opacity-10 shadow-lg">
                    
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle border border-success border-opacity-20 p-4 mb-3" style="width: 100px; height: 100px;">
                            <i class="bi bi-patch-check-fill fs-1 text-success"></i>
                        </div>
                        <h2 class="fw-bold text-white mb-2">¡Pago Realizado con Éxito!</h2>
                        <p class="text-muted-custom fs-6">Agradecemos tu confianza en EduCore.</p>
                    </div>

                    <div class="alert alert-info border-0 bg-info bg-opacity-5 text-info rounded-4 py-3 px-4 mb-4 text-start">
                        <div class="d-flex align-items-start">
                            <i class="bi bi-info-circle-fill me-3 fs-4 text-info mt-1"></i>
                            <div>
                                <span class="d-block fw-semibold mb-1 text-white">Activación en curso</span>
                                <span class="d-block fs-8 text-muted-custom">Estamos procesando tu pago de Stripe mediante el webhook seguro. Tu acceso al Aula Virtual se activará de forma automática en breves instantes.</span>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-3">
                        <a th:href="@{/mis-cursos}" class="btn btn-gradient py-3">
                            <i class="bi bi-journal-play me-2"></i> Ir a Mis Cursos
                        </a>
                        <a th:href="@{/catalogo}" class="btn btn-outline-light border-white border-opacity-10 py-3 hover-white">
                            <i class="bi bi-cart me-2"></i> Seguir Comprando
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{layout :: footer}"></footer>

    <!-- Bootstrap JS -->
    <div th:replace="~{layout :: bootstrap-js}"></div>
</body>
</html>
