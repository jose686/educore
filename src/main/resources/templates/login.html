<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: common-head('Iniciar Sesión')}"></head>
<body>
    <!-- Navbar -->
    <header th:replace="~{layout :: navbar}"></header>

    <!-- Main Content Container -->
    <main class="container my-auto py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                
                <!-- Status Alerts -->
                <div th:if="${param.error}" class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-3 py-3 px-4 mb-4" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                        <span>El correo electrónico o la contraseña son incorrectos.</span>
                    </div>
                </div>

                <div th:if="${param.logout}" class="alert alert-success border-0 bg-success bg-opacity-10 text-success rounded-3 py-3 px-4 mb-4" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                        <span>Has cerrado sesión correctamente.</span>
                    </div>
                </div>

                <div th:if="${param.success}" class="alert alert-success border-0 bg-success bg-opacity-10 text-success rounded-3 py-3 px-4 mb-4" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-stars me-2 fs-5"></i>
                        <span>¡Registro completado! Por favor, inicia sesión.</span>
                    </div>
                </div>

                <!-- Glassmorphic Login Card -->
                <div class="card glass-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-white mb-2">Bienvenido de nuevo</h2>
                        <p class="text-muted-custom">Accede a tu aula virtual y cursos</p>
                    </div>

                    <form th:action="@{/login}" method="POST">
                        <!-- Email Input -->
                        <div class="mb-4">
                            <label for="username" class="form-label">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-white border-opacity-10 text-secondary">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" id="username" name="username" class="form-control border-start-0" placeholder="tu@correo.com" required autofocus autocomplete="username">
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label for="password" class="form-label mb-0">Contraseña</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-white border-opacity-10 text-secondary">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="••••••••" required autocomplete="current-password">
                            </div>
                        </div>

                        <!-- Remember Me Checkbox -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                            <label class="form-check-label text-muted-custom" for="remember-me">
                                Recordarme
                            </label>
                        </div>

                        <!-- Login Button -->
                        <button type="submit" class="btn btn-gradient w-100 mt-2">
                            Iniciar Sesión <i class="bi bi-arrow-right-short ms-1 fs-5 align-middle"></i>
                        </button>
                    </form>

                    <!-- Link to Register -->
                    <div class="text-center mt-4 pt-2 border-top border-white border-opacity-10">
                        <p class="text-muted-custom mb-0">
                            ¿No tienes una cuenta? 
                            <a th:href="@{/register}" class="text-gradient text-decoration-none fw-semibold">Regístrate gratis</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{layout :: footer}"></footer>

    <!-- Bootstrap JS -->
    <div th:replace="~{layout :: bootstrap-js}"></div>
</body>
</html>
