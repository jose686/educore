<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: common-head('Registrarse')}"></head>
<body>
    <!-- Navbar -->
    <header th:replace="~{layout :: navbar}"></header>

    <!-- Main Content Container -->
    <main class="container my-auto py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <!-- Glassmorphic Register Card -->
                <div class="card glass-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-white mb-2">Crear Cuenta</h2>
                        <p class="text-muted-custom">Regístrate para comenzar a aprender</p>
                    </div>

                    <form th:action="@{/register}" th:object="${usuario}" method="POST" autocomplete="off">
                        
                        <!-- Name Input -->
                        <div class="mb-4">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-white border-opacity-10 text-secondary">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" id="nombre" th:field="*{nombre}" class="form-control border-start-0" th:errorclass="is-invalid" placeholder="Juan Pérez">
                                <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="invalid-feedback"></div>
                            </div>
                        </div>

                        <!-- Email Input -->
                        <div class="mb-4">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-white border-opacity-10 text-secondary">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" id="email" th:field="*{email}" class="form-control border-start-0" th:errorclass="is-invalid" placeholder="tu@correo.com">
                                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback"></div>
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-white border-opacity-10 text-secondary">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" id="password" th:field="*{password}" class="form-control border-start-0" th:errorclass="is-invalid" placeholder="Mínimo 6 caracteres">
                                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback"></div>
                            </div>
                        </div>

                        <!-- Register Button -->
                        <button type="submit" class="btn btn-gradient w-100 mt-2">
                            Crear mi cuenta <i class="bi bi-person-plus-fill ms-1 fs-5 align-middle"></i>
                        </button>
                    </form>

                    <!-- Link to Login -->
                    <div class="text-center mt-4 pt-2 border-top border-white border-opacity-10">
                        <p class="text-muted-custom mb-0">
                            ¿Ya tienes una cuenta? 
                            <a th:href="@{/login}" class="text-gradient text-decoration-none fw-semibold">Inicia sesión aquí</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{layout :: footer}"></footer>

    <!-- Bootstrap JS -->
    <div th:replace="~{layout :: bootstrap-js}"></div>
</body>
</html>
