<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{layout :: common-head('Crear Lección')}"></div>
    <!-- Quill WYSIWYG Theme CSS -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <style>
        /* Ajustes específicos para el editor Quill en dark-mode */
        .ql-toolbar {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .ql-toolbar .ql-stroke {
            stroke: #cbd5e1 !important;
        }
        .ql-toolbar .ql-fill {
            fill: #cbd5e1 !important;
        }
        .ql-toolbar .ql-picker {
            color: #cbd5e1 !important;
        }
        .ql-container {
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #f8fafc !important;
            background: rgba(255, 255, 255, 0.01);
            min-height: 250px;
        }
        .ql-editor.ql-blank::before {
            color: #64748b !important;
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside th:replace="~{layout :: admin-sidebar('cursos')}"></aside>

        <!-- Main Area -->
        <div class="admin-main">
            <!-- Navbar -->
            <header th:replace="~{layout :: admin-navbar('Nueva Lección')}"></header>

            <!-- Content Body -->
            <main class="admin-content-body">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-10">
                        
                        <!-- Back Link -->
                        <div class="mb-4">
                            <a th:href="@{'/admin/lms/cursos/' + ${modulo.curso.id} + '/temario'}" class="text-secondary text-decoration-none fs-7 hover-white">
                                <i class="bi bi-arrow-left me-1"></i> Cancelar y volver al temario
                            </a>
                        </div>

                        <!-- Glassmorphic Form Card -->
                        <div class="card glass-card p-4 p-md-5 border border-white border-opacity-10 shadow-lg">
                            <span class="text-gradient fw-bold text-uppercase fs-8 mb-2 d-inline-block" th:text="'Módulo: ' + ${modulo.nombre}">Nombre del Módulo</span>
                            <h2 class="fw-bold text-white mb-4">Añadir Nueva Lección</h2>
                            
                            <form th:action="@{'/admin/lms/modulos/' + ${modulo.id} + '/lecciones/nuevo'}" th:object="${leccionDto}" method="POST" id="leccionForm">
                                
                                <!-- Title -->
                                <div class="mb-4">
                                    <label for="titulo" class="form-label">Título de la Lección</label>
                                    <input type="text" id="titulo" th:field="*{titulo}" class="form-control" placeholder="ej: Lección 1: Aperturas Clásicas" required>
                                </div>

                                 <!-- Origen del Vídeo -->
                                 <div class="mb-4">
                                     <label class="form-label d-block text-muted-custom fw-semibold fs-7 mb-2">Origen del Vídeo</label>
                                     <div class="btn-group w-100" role="group" aria-label="Origen del Vídeo">
                                         <input type="radio" class="btn-check" name="esVideoLocal" id="videoSourceExterno" value="false" checked th:field="*{esVideoLocal}">
                                         <label class="btn btn-outline-light border-white border-opacity-10 py-2 fs-8 fw-semibold rounded-start-pill" for="videoSourceExterno">Vídeo Externo (YouTube/Vimeo)</label>
                                         
                                         <input type="radio" class="btn-check" name="esVideoLocal" id="videoSourceLocal" value="true" th:field="*{esVideoLocal}">
                                         <label class="btn btn-outline-light border-white border-opacity-10 py-2 fs-8 fw-semibold rounded-end-pill" for="videoSourceLocal">Vídeo Local (Biblioteca)</label>
                                     </div>
                                 </div>

                                 <!-- Video URL -->
                                 <div class="mb-4" id="div-video-url">
                                     <label for="videoUrl" class="form-label">Ruta / Enlace de Vídeo</label>
                                     <div class="input-group">
                                         <input type="text" id="videoUrl" th:field="*{videoUrl}" class="form-control" placeholder="ej: https://www.youtube.com/watch?v=...">
                                         <button class="btn btn-outline-light border-white border-opacity-10 fs-8 px-3 d-none" type="button" id="btnSeleccionarVideoLocal">
                                             Seleccionar Vídeo <i class="bi bi-film ms-1"></i>
                                         </button>
                                     </div>
                                     <small class="text-muted-custom fs-9 mt-1.5 d-block" id="videoHelpText">Pega el enlace al vídeo de YouTube o Vimeo.</small>
                                 </div>


                                <!-- Toggle switch for interactive zone -->
                                <div class="form-check form-switch mb-4">
                                    <input class="form-check-input" type="checkbox" role="switch" id="toggleInteractivo">
                                    <label class="form-check-label text-muted-custom fw-semibold fs-7" for="toggleInteractivo">Habilitar Zona Interactiva / Minijuego</label>
                                </div>

                                <!-- Interactive HTML URL (Conditional rendering) -->
                                <div class="mb-4" id="div-interactivo" style="display: none;">
                                    <label for="rutaScriptInteractivo" class="form-label">URL del Minijuego (Iframe HTML)</label>
                                    <div class="input-group">
                                        <input type="text" id="rutaScriptInteractivo" th:field="*{rutaScriptInteractivo}" class="form-control" placeholder="ej: /js/minigames/chess.html">
                                        <button class="btn btn-outline-light border-white border-opacity-10 fs-8 px-3" type="button" id="btnSeleccionarMinijuego">
                                            Seleccionar Recurso Educativo <i class="bi bi-controller ms-1"></i>
                                        </button>
                                    </div>
                                    <small class="text-muted-custom fs-9 mt-1.5 d-block">Pega la URL del archivo .html interactivo. Se renderizará de forma segura en un iframe aislado.</small>
                                </div>



                                <!-- Order (Auto-calculated in backend, hidden in frontend) -->
                                <div class="mb-4 d-none">
                                    <input type="number" id="orden" th:field="*{orden}">
                                </div>


                                <!-- Content Area (Quill Rich text WYSIWYG) -->
                                <div class="mb-4">
                                    <label class="form-label">Contenido Teórico (HTML Enriquecido)</label>
                                    
                                    <!-- Editor container -->
                                    <div id="editor-container"></div>
                                    
                                    <!-- Hidden input field to hold HTML payload on submit -->
                                    <textarea th:field="*{contenido}" id="contenido-hidden" class="d-none"></textarea>
                                </div>

                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-gradient w-100 py-3 mt-3">
                                    Guardar Lección <i class="bi bi-save-fill ms-2 align-middle fs-7"></i>
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <div th:replace="~{layout :: bootstrap-js}"></div>

    <!-- Modal Seleccionar Minijuego -->
    <div class="modal fade" id="modalSeleccionarMinijuego" tabindex="-1" aria-labelledby="modalSeleccionarMinijuegoLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content glass-card border border-white border-opacity-10 text-white shadow-lg" style="background: #0f172a;">
                <div class="modal-header border-bottom border-white border-opacity-10">
                    <h5 class="modal-title fw-bold" id="modalSeleccionarMinijuegoLabel">Seleccionar Recurso Educativo</h5>
                    <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0" style="height: 600px;">
                    <iframe src="/admin/media?tipo=HTML_INTERACTIVO,DOCUMENTO_PDF&categoria=RECURSO_CURSO&selectMode=true" style="width: 100%; height: 100%; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Seleccionar Vídeo Local -->
    <div class="modal fade" id="modalSeleccionarVideo" tabindex="-1" aria-labelledby="modalSeleccionarVideoLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content glass-card border border-white border-opacity-10 text-white shadow-lg" style="background: #0f172a;">
                <div class="modal-header border-bottom border-white border-opacity-10">
                    <h5 class="modal-title fw-bold" id="modalSeleccionarVideoLabel">Seleccionar Vídeo de la Biblioteca</h5>
                    <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0" style="height: 600px;">
                    <iframe src="/admin/media?tipo=VIDEO&selectMode=true" style="width: 100%; height: 100%; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Quill JS Library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <!-- Synchronize script to bind Quill editor with Hidden HTML input on Submit -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Redacta el contenido teórico o las explicaciones de la lección...'
            });

            // Toggle Switch Logic for Minijuego
            const toggleInteractivo = document.getElementById('toggleInteractivo');
            const divInteractivo = document.getElementById('div-interactivo');
            const inputInteractivo = document.getElementById('rutaScriptInteractivo');

            if (inputInteractivo.value.trim() !== '') {
                toggleInteractivo.checked = true;
                divInteractivo.style.display = 'block';
            }

            toggleInteractivo.addEventListener('change', function () {
                if (this.checked) {
                    divInteractivo.style.display = 'block';
                } else {
                    divInteractivo.style.display = 'none';
                    inputInteractivo.value = '';
                }
            });

            // Video Source Selector Switch
            const sourceExterno = document.getElementById('videoSourceExterno');
            const sourceLocal = document.getElementById('videoSourceLocal');
            const videoUrlInput = document.getElementById('videoUrl');
            const btnSeleccionarVideo = document.getElementById('btnSeleccionarVideoLocal');
            const videoHelpText = document.getElementById('videoHelpText');

            function updateVideoSourceUI() {
                if (sourceLocal.checked) {
                    videoUrlInput.readOnly = true;
                    videoUrlInput.placeholder = 'Selecciona un vídeo local...';
                    btnSeleccionarVideo.classList.remove('d-none');
                    videoHelpText.textContent = 'Selecciona un vídeo local de la biblioteca.';
                } else {
                    videoUrlInput.readOnly = false;
                    videoUrlInput.placeholder = 'ej: https://www.youtube.com/watch?v=...';
                    btnSeleccionarVideo.classList.add('d-none');
                    videoHelpText.textContent = 'Pega el enlace al vídeo de YouTube o Vimeo.';
                }
            }

            sourceExterno.addEventListener('change', updateVideoSourceUI);
            sourceLocal.addEventListener('change', updateVideoSourceUI);
            updateVideoSourceUI(); // Initial check

            // Selection callback for minijuego and local video
            const modalSeleccionar = new bootstrap.Modal(document.getElementById('modalSeleccionarMinijuego'));
            document.getElementById('btnSeleccionarMinijuego').addEventListener('click', function () {
                modalSeleccionar.show();
            });

            const modalSeleccionarVideo = new bootstrap.Modal(document.getElementById('modalSeleccionarVideo'));
            btnSeleccionarVideo.addEventListener('click', function () {
                modalSeleccionarVideo.show();
            });

            window.onMinijuegoSelected = function (url) {
                if (document.getElementById('modalSeleccionarVideo').classList.contains('show')) {
                    videoUrlInput.value = url;
                    modalSeleccionarVideo.hide();
                } else if (document.getElementById('modalSeleccionarMinijuego').classList.contains('show')) {
                    inputInteractivo.value = url;
                    modalSeleccionar.hide();
                }
            };

            var form = document.getElementById('leccionForm');
            form.addEventListener('submit', function (e) {
                var contenidoHidden = document.getElementById('contenido-hidden');
                contenidoHidden.value = quill.root.innerHTML;
                
                if (quill.getText().trim().length === 0) {
                    alert('El contenido teórico no puede estar vacío.');
                    e.preventDefault();
                }
            });
        });
    </script>


</body>
</html>
